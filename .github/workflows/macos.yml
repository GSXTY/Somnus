name: Somnus macOS packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Build workbench
        working-directory: page_design/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build macOS package
        run: |
          python -m pip install -r requirements-electron.txt
          pnpm --dir electron install --frozen-lockfile
          node --test electron/backend.test.cjs
          python build_electron.py
      - name: Verify packaged app and create installer disk image
        shell: bash
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$temp_dir"' EXIT
          version="$(python -c 'from app_version import APP_VERSION; print(APP_VERSION)')"
          package="Somnus-${version}-electron-macos-${PACKAGE_ARCH}.zip"
          ditto -x -k "dist/electron/$package" "$temp_dir"
          app="$temp_dir/Somnus.app"
          backend="$app/Contents/Resources/backend/SomnusBackend"
          codesign --verify --deep --strict "$app"
          expected_arch="$PACKAGE_ARCH"
          if [[ "$expected_arch" == "x64" ]]; then expected_arch=x86_64; fi
          [[ "$(lipo -archs "$app/Contents/MacOS/Somnus")" == "$expected_arch" ]]
          [[ "$(lipo -archs "$backend")" == "$expected_arch" ]]
          python tests/electron_package_smoke.py "$backend"
          staging="$temp_dir/dmg"
          mkdir "$staging"
          mv "$app" "$staging/Somnus.app"
          ln -s /Applications "$staging/Applications"
          image="Somnus-${version}-macos-${PACKAGE_ARCH}.dmg"
          hdiutil create -volname Somnus -srcfolder "$staging" -format UDZO "dist/electron/$image"
          cd dist/electron
          hdiutil verify "$image"
          shasum -a 256 "$image" > "$image.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: somnus-macos-${{ matrix.arch }}
          path: |
            dist/electron/Somnus-*-macos-${{ matrix.arch }}.dmg
            dist/electron/Somnus-*-macos-${{ matrix.arch }}.dmg.sha256
          compression-level: 0
          if-no-files-found: error
