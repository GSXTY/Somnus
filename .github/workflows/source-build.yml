name: Source compilation

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitmodules'
      - 'vendor/dsh-next'
      - 'desktop/dsh_next/source-*'
      - 'desktop/dsh_next/stage-next.mjs'
      - 'tools/prepare_dsh_source.py'
      - 'build_electron.py'
      - '.github/workflows/source-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: source-compilation
    if: >-
      !(github.event_name == 'pull_request' && github.event.pull_request.number == 4 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'build/local-source-update')
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - name: Allow long paths in the isolated Windows runner
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.28.5'
      - name: Set isolated build storage
        run: |
          $buildStorage = Join-Path $env:RUNNER_TEMP 's'
          "SOMNUS_DEV_STORAGE=$buildStorage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sourceLock = Get-Content -LiteralPath 'desktop/dsh_next/source-lock.json' -Raw | ConvertFrom-Json
          $sourceReport = Join-Path $buildStorage ('s/' + $sourceLock.commit.Substring(0, 12) + '/somnus-source-build.json')
          "SOMNUS_SOURCE_REPORT=$sourceReport" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOMNUS_SOURCE_WORKSPACE=$(Split-Path -Parent $sourceReport)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the actual upstream source snapshot
        run: node desktop/dsh_next/source-build.mjs --prepare --storage $env:SOMNUS_DEV_STORAGE
      - name: Install Somnus UI and desktop support dependencies
        run: |
          pnpm --dir page_design/frontend install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir electron install --frozen-lockfile --ignore-scripts
      - name: Install Somnus backend build dependencies
        run: python -m pip install -r requirements-electron.txt -r requirements-test.txt
      - name: Verify source and build shared UI
        run: |
          python -B tools/source_checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir page_design/frontend build
      - name: Build Somnus backend from source
        run: |
          python -B build_electron.py --backend-only
          $buildCode = $LASTEXITCODE
          if ($buildCode -ne 0) {
            $gatePath = Join-Path $env:SOMNUS_DEV_STORAGE 'artifacts/build/electron/platform-gate.json'
            if (Test-Path -LiteralPath $gatePath) {
              $gate = Get-Content -LiteralPath $gatePath -Raw | ConvertFrom-Json
              if ($gate.provenance.assets_error) { Write-Output $gate.provenance.assets_error }
              foreach ($check in $gate.checks) {
                if (!$check.ok) {
                  Write-Output ("Failed gate: " + $check.id)
                  Write-Output $check.summary
                }
              }
            }
            exit $buildCode
          }
      - name: Compile DSH and Somnus into an isolated application directory
        timeout-minutes: 30
        run: |
          $backendDir = Join-Path $env:SOMNUS_DEV_STORAGE 'artifacts/build/electron/backend/SomnusBackend'
          $pnpmEntry = Join-Path (Split-Path -Parent $env:PNPM_HOME) 'pnpm/bin/pnpm.mjs'
          if (!(Test-Path -LiteralPath $pnpmEntry)) { throw 'Pinned pnpm JavaScript entry is missing' }
          node desktop/dsh_next/source-build.mjs --build --storage $env:SOMNUS_DEV_STORAGE --backend-dir $backendDir --pnpm-entry $pnpmEntry
      - name: Preserve source compilation report
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: source-compilation-report
          path: |
            ${{ env.SOMNUS_SOURCE_REPORT }}
            ${{ runner.temp }}/s/artifacts/build/electron/platform-gate.json
            ${{ env.SOMNUS_SOURCE_WORKSPACE }}/apps/desktop/.desktop-build/packaging-runs/*/*.log
            ${{ env.SOMNUS_SOURCE_WORKSPACE }}/apps/desktop/.desktop-build/packaging-runs/*/*.json
            ${{ env.SOMNUS_SOURCE_WORKSPACE }}/apps/desktop/.desktop-build/packaging-runs/*/*.jsonl
          if-no-files-found: ignore

      - name: Validate the requested local application delivery
        if: >-
          success() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'build/local-source-update'
        env:
          SOMNUS_DELIVERY_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          source_commit = '31d232e27b12fded71b51c5a59687dc44aebf750'
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pull = event['pull_request']
          if (os.environ['GITHUB_EVENT_NAME'] != 'pull_request'
              or pull['head']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']
              or pull['head']['ref'] != 'build/local-source-update'
              or pull['base']['sha'] != source_commit):
              raise RuntimeError('Application delivery is restricted to the requested source baseline and branch')

          workspace = Path(os.environ['SOMNUS_SOURCE_WORKSPACE']).resolve(strict=True)
          application = (workspace / 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/win-unpacked').resolve(strict=True)
          if not application.is_relative_to(workspace):
              raise RuntimeError('Application output is outside the fresh source workspace')
          report = json.loads(Path(os.environ['SOMNUS_SOURCE_REPORT']).read_text(encoding='utf-8'))
          required = {'ok': True, 'applicationReady': True, 'terminalSmoke': True,
                      'uiAccepted': False, 'originalAsarRequired': False, 'installerCreated': False}
          if any(report.get(name) is not value for name, value in required.items()):
              raise RuntimeError('The source compilation report does not qualify this application for local delivery')
          if Path(report['application']).resolve(strict=True) != application:
              raise RuntimeError('The source compilation report identifies a different application')
          lock = json.loads(Path('desktop/dsh_next/source-lock.json').read_text(encoding='utf-8'))
          if report['commit'] != lock['commit']:
              raise RuntimeError('Application upstream commit differs from the source lock')
          for name in ['Somnus.exe', 'resources/app.asar', 'resources/backend/SomnusBackend.exe']:
              if not (application / name).is_file():
                  raise RuntimeError('Required application file is missing: ' + name)

          files = []
          for directory, directories, names in os.walk(application, followlinks=False):
              for name in directories + names:
                  path = Path(directory) / name
                  if path.is_symlink() or path.is_junction():
                      raise RuntimeError('Application delivery must contain regular files and directories only')
              for name in sorted(names):
                  path = Path(directory) / name
                  relative = path.relative_to(application).as_posix()
                  if relative == 'delivery-manifest.json':
                      continue
                  if name in {'.env', 'mcp.json'} or any(part in {'.git', '.somnus-git'} for part in path.relative_to(application).parts):
                      raise RuntimeError('Local-only configuration was found in the fresh application tree')
                  with path.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  files.append({'path': relative, 'bytes': path.stat().st_size, 'sha256': digest})
          files.sort(key=lambda row: row['path'])
          manifest = {
              'schemaVersion': 1, 'producer': 'SomnusNext source CI local delivery',
              'sourceCommit': source_commit,
              'buildHead': os.environ['SOMNUS_DELIVERY_HEAD'],
              'checkoutCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'repository': os.environ['GITHUB_REPOSITORY'], 'ref': os.environ['GITHUB_REF'],
              'headRef': pull['head']['ref'], 'upstreamCommit': report['commit'],
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              **required, 'files': files,
          }
          (application / 'delivery-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              stream.write('SOMNUS_DELIVERY_APPLICATION=' + str(application) + '\n')
          print('Validated local application delivery: ' + str(len(files)) + ' files')

      - name: Preserve the requested local application for one day
        if: >-
          success() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'build/local-source-update'
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: somnus-local-source-update
          path: ${{ env.SOMNUS_DELIVERY_APPLICATION }}/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 3

  transfer:
    name: transfer-verified-local-application
    if: >-
      success() && github.event_name == 'pull_request' && github.event.pull_request.number == 4 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'build/local-source-update' &&
      github.event.pull_request.base.sha == '31d232e27b12fded71b51c5a59687dc44aebf750'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      SOMNUS_TRANSFER_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Retrieve the already verified source application
        uses: actions/download-artifact@v4
        with:
          name: somnus-local-source-update
          path: ${{ runner.temp }}/somnus-source-transfer/application
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44899550385
      - name: Verify the application tree and split its transport archive
        id: split
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import zipfile

          source_commit = '31d232e27b12fded71b51c5a59687dc44aebf750'
          build_head = '18ab8e92ca010e81685ebfd6e33c40ee9abd1973'
          upstream_commit = 'f2483c6d26104b3594cb0e22f56c0331b55dfffe'
          source_run = '44899550385'
          part_limit = 300 * 1024 * 1024
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pull = event['pull_request']
          if (os.environ['GITHUB_EVENT_NAME'] != 'pull_request'
              or pull['number'] != 4
              or pull['head']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']
              or pull['head']['ref'] != 'build/local-source-update'
              or pull['base']['sha'] != source_commit):
              raise RuntimeError('Transfer is restricted to the requested source baseline and same-repository PR')

          transfer = Path(os.environ['RUNNER_TEMP']) / 'somnus-source-transfer'
          application = (transfer / 'application').resolve(strict=True)
          original_manifest = application / 'delivery-manifest.json'
          original_bytes = original_manifest.read_bytes()
          delivery = json.loads(original_bytes)
          required = {'ok': True, 'applicationReady': True, 'terminalSmoke': True,
                      'uiAccepted': False, 'originalAsarRequired': False, 'installerCreated': False}
          if (delivery.get('sourceCommit') != source_commit or delivery.get('buildHead') != build_head
              or delivery.get('upstreamCommit') != upstream_commit or delivery.get('runId') != source_run
              or any(delivery.get(name) is not value for name, value in required.items())):
              raise RuntimeError('The downloaded application is not the verified source build')

          expected = set()
          for row in delivery['files']:
              name = row['path']
              logical = PurePosixPath(name)
              if (logical.is_absolute() or '\\' in name or '..' in logical.parts
                  or name == 'delivery-manifest.json' or name in expected):
                  raise RuntimeError('Invalid or duplicate application manifest path')
              path = (application / name).resolve(strict=True)
              if not path.is_relative_to(application) or not path.is_file():
                  raise RuntimeError('Application manifest points outside its tree')
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              if path.stat().st_size != row['bytes'] or digest != row['sha256']:
                  raise RuntimeError('Application file integrity failed: ' + name)
              expected.add(name)
          actual = set()
          for directory, directories, names in os.walk(application, followlinks=False):
              for name in directories + names:
                  path = Path(directory) / name
                  if path.is_symlink() or path.is_junction():
                      raise RuntimeError('Transport must not follow filesystem links')
              actual.update((Path(directory) / name).relative_to(application).as_posix() for name in names)
          if actual != expected | {'delivery-manifest.json'}:
              raise RuntimeError('Application tree contains missing or unlisted files')

          output = transfer / 'transport'
          output.mkdir()
          archive = output / 'somnus-local-source-update.transport.zip'
          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=3) as zipped:
              for name in sorted(actual):
                  zipped.write(application / name, arcname=name)
          archive_bytes = archive.stat().st_size
          count = (archive_bytes + part_limit - 1) // part_limit
          if not 1 <= count <= 3:
              raise RuntimeError('Transport archive requires more than the three permitted 300 MiB parts')
          with archive.open('rb') as stream:
              archive_digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          parts = []
          with archive.open('rb') as stream:
              for number in range(1, count + 1):
                  part = output / (archive.name + '.part' + str(number).zfill(3))
                  digest = hashlib.sha256()
                  written = 0
                  with part.open('wb') as target:
                      while written < part_limit:
                          chunk = stream.read(min(1024 * 1024, part_limit - written))
                          if not chunk:
                              break
                          target.write(chunk)
                          digest.update(chunk)
                          written += len(chunk)
                  if not 0 < written <= part_limit:
                      raise RuntimeError('Transport part size is outside the allowed range')
                  parts.append({'file': part.name, 'artifact': 'somnus-local-source-update-part-' + str(number).zfill(3),
                                'bytes': written, 'sha256': digest.hexdigest()})
                  with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as values:
                      values.write('part' + str(number) + '=' + str(part) + '\n')
              if stream.read(1):
                  raise RuntimeError('Transport archive was not completely split')
          manifest = {
              'schemaVersion': 1, 'producer': 'SomnusNext verified application transport',
              'sourceCommit': source_commit, 'buildHead': build_head, 'upstreamCommit': upstream_commit,
              'sourceRunId': source_run,
              'sourceArtifact': {'id': 14705389197, 'name': 'somnus-local-source-update', 'bytes': 615040505,
                                 'sha256': '99f95ef521b64e0dcd9d6f6215e65a83576b1b7b80e61c6fb03736fb7d92c173'},
              'deliveryManifestSha256': hashlib.sha256(original_bytes).hexdigest(),
              'transferHead': os.environ['SOMNUS_TRANSFER_HEAD'], 'transferRef': os.environ['GITHUB_REF'],
              'transferRunId': os.environ['GITHUB_RUN_ID'],
              'archive': {'file': archive.name, 'bytes': archive_bytes, 'sha256': archive_digest},
              'partLimitBytes': part_limit, 'parts': parts,
          }
          (output / 'transport-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print('Verified application and prepared ' + str(count) + ' bounded transport parts')
      - name: Retain transport part one
        if: success() && steps.split.outputs.part1 != ''
        uses: actions/upload-artifact@v4
        with:
          name: somnus-local-source-update-part-001
          path: ${{ steps.split.outputs.part1 }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Retain transport part two
        if: success() && steps.split.outputs.part2 != ''
        uses: actions/upload-artifact@v4
        with:
          name: somnus-local-source-update-part-002
          path: ${{ steps.split.outputs.part2 }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Retain transport part three
        if: success() && steps.split.outputs.part3 != ''
        uses: actions/upload-artifact@v4
        with:
          name: somnus-local-source-update-part-003
          path: ${{ steps.split.outputs.part3 }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Retain the transport manifest
        uses: actions/upload-artifact@v4
        with:
          name: somnus-local-source-update-transport-manifest
          path: ${{ runner.temp }}/somnus-source-transfer/transport/transport-manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

# Ordinary runs compile and upload only reports. PR 4 transfers its already verified
# application as bounded one-day artifacts; no installer or Release is published.
