<script>
(() => {
  const root = document.getElementById('ya70-preview');
  const template = document.getElementById('ya70-app-template');
  const records = [
    {id:'示例 R-A',user:'示例用户甲',device:'示例设备 A',model:'YA70A20',date:'2026-11-09',start:'2026-11-10 00:15:00',end:'2026-11-10 02:00:00',minutes:90,apnea:2,hypopnea:3,central:1,apneaSeconds:24,hypopneaSeconds:39,centralSeconds:12,ahi:4.2,firmware:'演示 F1',hardware:'演示 H1'},
    {id:'示例 R-B',user:'示例用户乙',device:'示例设备 B',model:'YA70B20',date:'2026-11-09',start:'2026-11-09 01:00:00',end:'2026-11-09 03:00:00',minutes:120,apnea:null,hypopnea:2,central:null,apneaSeconds:null,hypopneaSeconds:25,centralSeconds:null,ahi:1.0,firmware:'演示 F2',hardware:'演示 H1'},
    {id:'示例 R-C',user:'示例用户丙',device:'示例设备 C',model:'YA70B25',date:'2026-11-08',start:'2026-11-08 22:00:00',end:'2026-11-08 23:10:00',minutes:60,apnea:0,hypopnea:0,central:0,apneaSeconds:0,hypopneaSeconds:0,centralSeconds:0,ahi:0,firmware:'演示 F1',hardware:'演示 H2'},
    {id:'示例 R-D',user:'示例用户甲',device:'示例设备 D',model:'YA70B30/YA70Pro',date:'2026-11-07',start:'2026-11-07 01:00:00',end:'2026-11-07 04:00:00',minutes:180,apnea:3,hypopnea:1,central:1,apneaSeconds:36,hypopneaSeconds:14,centralSeconds:12,ahi:1.3,firmware:'演示 F3',hardware:'演示 H2'},
    {id:'示例 R-E',user:'示例用户丁',device:'示例设备 E',model:'YA70LAB',date:'2026-11-06',start:'2026-11-06 02:00:00',end:'2026-11-06 03:00:00',minutes:null,apnea:1,hypopnea:null,central:null,apneaSeconds:11,hypopneaSeconds:null,centralSeconds:null,ahi:null,firmware:'演示 LAB',hardware:'演示 H3'},
    {id:'示例 R-F',user:'示例用户乙',device:'示例设备 F',model:'YA70A20',date:'2026-11-03',start:'2026-11-03 01:00:00',end:'2026-11-03 01:50:00',minutes:45,apnea:1,hypopnea:2,central:0,apneaSeconds:13,hypopneaSeconds:22,centralSeconds:0,ahi:4.0,firmware:'演示 F1',hardware:'演示 H1'},
    {id:'示例 R-G',user:'示例用户丁',device:'示例设备 G',model:'YA70B20',date:'2026-11-04',start:'2026-11-04 01:00:00',end:'2026-11-04 02:30:00',minutes:80,apnea:0,hypopnea:1,central:0,apneaSeconds:0,hypopneaSeconds:15,centralSeconds:0,ahi:0.8,firmware:'演示 F2',hardware:'演示 H1'},
    {id:'示例 R-H',user:'示例用户甲',device:'示例设备 H',model:'YA70B25',date:'2026-11-09',start:'2026-11-09 04:00:00',end:'2026-11-09 04:30:00',minutes:25,apnea:0,hypopnea:1,central:0,apneaSeconds:0,hypopneaSeconds:12,centralSeconds:0,ahi:2.4,firmware:'演示 F1',hardware:'演示 H2'}
  ];
  const known = x => typeof x === 'number' && Number.isFinite(x);
  const fmt = x => known(x) ? x.toLocaleString('zh-CN',{maximumFractionDigits:1}) : '未上报';
  const element = (tag,cls,text) => {const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=String(text);return node;};
  const summary = (rows,key) => {const values=rows.map(r=>r[key]).filter(known);return {value:values.length?values.reduce((a,b)=>a+b,0):null,reported:values.length,total:rows.length};};
  const subtotal = s => !s.total ? '无示例记录' : `${s.reported===s.total?'已上报':'已上报小计'} ${s.reported}/${s.total} 份`;
  function dates(state){const end=new Date(state.date+'T00:00:00Z');if(!Number.isFinite(end.getTime()))return [];return Array.from({length:Number(state.period)},(_,i)=>{const d=new Date(end);d.setUTCDate(d.getUTCDate()-Number(state.period)+1+i);return d.toISOString().slice(0,10);});}
  function filter(state){const days=dates(state);return records.filter(r=>(state.model==='all'||r.model===state.model)&&days.includes(r.date)).slice().sort((a,b)=>b.date.localeCompare(a.date)||a.id.localeCompare(b.id));}
  function save(app,state){if(window.openai?.setWidgetState){const all={};root.querySelectorAll('.ya-app').forEach(a=>{all[a.dataset.layout]=a.yaState;});Promise.resolve(window.openai.setWidgetState({modelContent:{prototype:'YA70 合成设计评审',choices:all},privateContent:null})).catch(()=>{});}}
  function detail(app,row){
    const target=app.querySelector('[data-role=detail]');target.replaceChildren();target.hidden=false;
    const head=element('div','ya-section-head');head.append(element('h2','',row.id+' · 上报原值详情'));const close=element('button','','收起');close.type='button';close.onclick=()=>{app.yaState.selected=null;target.hidden=true;save(app,app.yaState);};head.append(close);target.append(head,element('p','ya-note','设计原型 · 合成演示 · 未连接后台。日期/时间保留来源原值；治疗时长不等同起止跨度或有效分析时长。'));
    const grid=element('div','ya-detail-grid');
    const fields=[['来源记录日期',row.date],['开始时间原值',row.start],['结束时间原值',row.end],['治疗时长上报值',fmt(row.minutes)+(known(row.minutes)?' 分钟（合成单位）':'')],['后台 AHI 原值',fmt(row.ahi)],['示例用户字段',row.user+' · 归属未验证'],['设备 / 型号',row.device+' / '+row.model],['固件 / 硬件',row.firmware+' / '+row.hardware],['暂停次数 / 持续秒数',fmt(row.apnea)+' / '+fmt(row.apneaSeconds)],['中枢次数 / 持续秒数',fmt(row.central)+' / '+fmt(row.centralSeconds)],['低通气次数 / 持续秒数',fmt(row.hypopnea)+' / '+fmt(row.hypopneaSeconds)],['创建时间 / 压力 / 漏气等','原型未提供 · 待核实字段及单位']];
    fields.forEach(([label,value])=>{const pair=element('div','');pair.append(element('small','',label),element('span','',value));grid.append(pair);});target.append(grid,element('p','ya-note','中枢与暂停的包含关系待核实，不相加。AHI 不与本地候选率混合。后台治疗时长单位及日期时区尚未核实。'));
    const actions=element('div','ya-detail-actions');['APP 图形 · 未接入','分钟数据 · 未验证','压缩文件 · 未验证','本地检测 · 未接文件'].forEach(text=>{const button=element('button','',text);button.type='button';button.disabled=true;actions.append(button);});target.append(actions);
  }
  function render(app){
    const state=app.yaState, q=role=>app.querySelector('[data-role='+role+']'), rows=filter(state), local=state.mode==='local';
    app.classList.toggle('ya-records-view',state.view==='records');app.classList.toggle('ya-dense',state.dense);
    q('title').textContent=state.view==='records'?'记录检索':state.layout==='patrol'?'巡检总览':'记录工作台';q('model').value=state.model;q('period').value=state.period;q('date').value=state.date;
    app.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.nav===state.view)));app.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
    q('notice').textContent=local?'本地候选 · 未检测。没有可读取文件、算法结果及有效分析区间，候选未知；下方仅保留示例记录定位。':'合成示例 · 后台仅确认单日查询；7 日为未来范围视图，分页完整性与真实用户归属待核实。';
    const metrics=local?[['已定位示例记录',rows.length,'不是已扫描记录'],['本地候选','—','未检测，不能填后台次数'],['有效分析小时','—','不能使用治疗时长代替'],['候选 / 有效小时','—','分母及结果均未取得']]:[
      ['有使用记录用户',rows.length?new Set(rows.map(r=>r.user)).size:'—','当前上报字段去重，非真实归属'],
      ['后台治疗时长',fmt(summary(rows,'minutes').value),subtotal(summary(rows,'minutes'))+' · 分钟（演示）'],
      ['暂停次数',fmt(summary(rows,'apnea').value),subtotal(summary(rows,'apnea'))+' · 次'],
      ['低通气次数',fmt(summary(rows,'hypopnea').value),subtotal(summary(rows,'hypopnea'))+' · 次']];
    q('stats').replaceChildren();metrics.forEach(([label,value,note])=>{const card=element('div','ya-stat');card.append(element('label','',label),element('strong','',value),element('small','',note));q('stats').append(card);});
    const dayList=dates(state);q('scope').textContent=`后台记录日期 ${dayList[0]||'未选择'} — ${dayList.at(-1)||'未选择'} · ${state.model==='all'?'YA70 全系列':state.model} · ${rows.length} 份合成记录；不代表后台完整数据。`;
    q('days').replaceChildren();dayList.forEach(day=>{const dayRows=rows.filter(r=>r.date===day),button=element('button','ya-day');button.type='button';button.append(element('small','',day.slice(5)),element('strong','',dayRows.length?`${dayRows.length} 份`:'无示例记录'));button.append(element('span','',local?'未检测':dayRows.length?`${fmt(summary(dayRows,'apnea').value)} / ${fmt(summary(dayRows,'hypopnea').value)}`:'— / —'));if(dayRows.length&&!local)button.append(element('span','',`上报 ${summary(dayRows,'apnea').reported}/${dayRows.length} · ${summary(dayRows,'hypopnea').reported}/${dayRows.length}`));button.onclick=()=>{state.date=day;state.period='1';state.selected=null;render(app);save(app,state);};q('days').append(button);});
    q('rows').replaceChildren();q('recordcards').replaceChildren();q('record-count').textContent=rows.length+' 份示例';
    function open(row){state.selected=row.id;detail(app,row);save(app,state);}
    rows.forEach(row=>{const tr=element('tr',''),identity=element('td','');identity.append(element('span','',row.id),element('small','',row.model),element('small','',row.user));tr.append(identity,element('td','',row.date.slice(5)),element('td','',known(row.minutes)?fmt(row.minutes)+' 分':fmt(row.minutes)),element('td','',local?'未检测':fmt(row.apnea)+' / '+fmt(row.hypopnea)));const cell=element('td',''),button=element('button','','查看');button.type='button';button.setAttribute('aria-label','查看'+row.id);button.onclick=()=>open(row);cell.append(button);tr.append(cell);q('rows').append(tr);
      const card=element('div','ya-item');card.append(element('h2','',row.id),element('p','',`${row.model} · ${row.date} · ${row.user}`),element('p','',`治疗时长 ${fmt(row.minutes)}；${local?'本地未检测':`暂停 ${fmt(row.apnea)} / 低通气 ${fmt(row.hypopnea)}`}`));const view=element('button','','查看合成记录');view.type='button';view.onclick=()=>open(row);card.append(view);q('recordcards').append(card);
    });
    if(!rows.length){const tr=element('tr',''),cell=element('td','ya-empty','当前型号与日期下无示例记录');cell.colSpan=5;tr.append(cell);q('rows').append(tr);q('recordcards').append(element('p','ya-empty','当前型号与日期下无示例记录'));}
    const missing=rows.filter(r=>[r.minutes,r.apnea,r.hypopnea,r.ahi].some(v=>v===null)),dateShift=rows.filter(r=>r.start.slice(0,10)!==r.date);
    const issues=local?[['本地结果尚未取得',`${rows.length} 份示例记录均未检测；没有候选或有效分析分母。`,rows[0]],['文件格式仍待核实','分钟与压缩文件入口仅示意，不加载真实数据。',null]]:[['日期归属待核对',`${dateShift.length} 份示例的后台日期与起始日期不同；不自动判错。`,dateShift[0]],['上报字段需补核',`${missing.length} 份示例存在空白；小计不代表完整总量。`,missing[0]],['本地分析尚未开展',`${rows.length} 份示例仅有上报值；算法、原始文件和有效时长未接入。`,rows[0]]];
    q('issues').replaceChildren();issues.forEach(([title,text,row])=>{const item=element('div','ya-item');item.append(element('h2','',title),element('p','',text));if(row){const button=element('button','','查看示例证据');button.type='button';button.onclick=()=>open(row);item.append(button);}q('issues').append(item);});
    q('detail').hidden=true;const selected=rows.find(r=>r.id===state.selected);if(selected)detail(app,selected);
    q('assistant').hidden=!state.assistant;q('answer').textContent=state.answer||'仅展示本地回答示例，不读取真实数据。';
  }
  const saved=window.openai?.widgetState?.modelContent?.choices||{};
  function apply(app,incoming){if(!incoming||typeof incoming!=='object')return;const state=app.yaState;if(['all',...records.map(r=>r.model)].includes(incoming.model))state.model=incoming.model;if(['7','1'].includes(String(incoming.period)))state.period=String(incoming.period);if(/^2026-11-0[3-9]$/.test(incoming.date))state.date=incoming.date;if(['backend','local'].includes(incoming.mode))state.mode=incoming.mode;if(['patrol','records'].includes(incoming.view))state.view=incoming.view;if(typeof incoming.dense==='boolean')state.dense=incoming.dense;if(typeof incoming.assistant==='boolean')state.assistant=incoming.assistant;state.selected=records.some(r=>r.id===incoming.selected)?incoming.selected:null;}
  root.querySelectorAll('.ya-app').forEach(app=>{
    app.append(template.content.cloneNode(true));const state=app.yaState={layout:app.dataset.layout,model:'all',period:'7',date:'2026-11-09',mode:'backend',view:'patrol',dense:app.dataset.layout==='records',assistant:true,selected:null,answer:''};apply(app,saved[app.dataset.layout]);render(app);
    for(const role of ['model','period','date'])app.querySelector('[data-role='+role+']').addEventListener('change',event=>{if(role==='date'&&!/^2026-11-0[3-9]$/.test(event.target.value)){event.target.value=state.date;return;}state[role]=event.target.value;state.selected=null;state.answer='';render(app);save(app,state);});
    app.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{state.mode=button.dataset.mode;state.selected=null;render(app);save(app,state);}));
    app.querySelectorAll('[data-nav]').forEach(button=>button.addEventListener('click',()=>{state.view=button.dataset.nav;render(app);save(app,state);}));
    app.querySelectorAll('[data-question]').forEach(button=>button.addEventListener('click',()=>{const rows=filter(state);const answers={missing:`回答示例（非 AI）：当前 ${rows.length} 份合成记录中，${rows.filter(r=>[r.minutes,r.apnea,r.hypopnea,r.ahi].some(v=>v===null)).length} 份有展示字段未上报。缺值不补 0，详情可查看原值。`,date:'回答示例（非 AI）：记录日期、开始时间可能按不同规则归日。后台时区、跨日和补传规则未核实，不能直接认定错误。',local:'回答示例（非 AI）：还需授权的原始文件、稳定记录键、字段与时间轴、算法参数和有效分析区间；不把后台 AHI 当作本地候选结果。'};state.answer=answers[button.dataset.question];render(app);}));
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>render(app)});tweak.addToggle(state,'dense',{label:'紧凑记录行'});tweak.addToggle(state,'assistant',{label:'显示建议问题'});}
  });
  window.addEventListener('openai:set_globals',event=>{const choices=event.detail?.globals?.widgetState?.modelContent?.choices;if(choices)root.querySelectorAll('.ya-app').forEach(app=>{apply(app,choices[app.dataset.layout]);render(app);});});
  if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
})();
</script>
